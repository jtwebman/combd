[package]
name = "combd-guest"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace, so its release profile (panic = abort) never touches the host.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["arena"]
# combd SDK idea: a per-request arena allocator (Wasm builds only).
arena = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
