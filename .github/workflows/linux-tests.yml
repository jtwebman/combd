name: linux tests
# What only Linux can test (kernel TLS, io_uring), on the self-hosted
# runner: the Mac that runs check.sh can't, and neither can Docker
# Desktop's kernel (no kTLS).
on:
  push:
    branches: [main]
    paths: [spike/ktls/**, spike/src/tls.rs, spike/src/http.rs, .github/workflows/linux-tests.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: [self-hosted, linux, x64, combd-build]
    steps:
      - uses: actions/checkout@v4
      - name: What this kernel has
        run: |
          uname -r
          sudo -n modprobe tls 2>/dev/null || true
          cat /proc/sys/net/ipv4/tcp_available_ulp 2>/dev/null || echo "no tcp_available_ulp"
      # On the runner itself, not in Docker: here Docker's containers run in
      # Docker Desktop's VM, whose kernel has no kTLS; WSL's has.
      - name: Rust (once; kept in the runner's home)
        run: |
          [ -x ~/.cargo/bin/cargo ] || curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.94.1
          ~/.cargo/bin/rustup toolchain install 1.94.1 --profile minimal
      - name: Kernel TLS
        run: cd spike && ~/.cargo/bin/cargo +1.94.1 test -q --release -p combd-ktls
