# The arena, built and rolled out: the image (combd and the game module)
# built on linux/amd64 and pushed to ghcr.io/<owner>/combd-arena (public, so
# droplets can pull it), then the game deployed through the admin API.
# The nodes move to the new image by themselves (cloud/combd-update.sh), one
# at a time. Neither cuts off a game in play: each waits for live matches to
# end, up to a limit.
name: arena image
on:
  push:
    branches: [main]
    paths: [combd/**, guest/**, guest-ev/**, examples/arena/**, "!examples/arena/cloud/**", "!**/*.md", .github/workflows/arena-image.yml]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  image:
    runs-on: [self-hosted, linux, x64, combd-build]
    steps:
      - uses: actions/checkout@v4
      - name: Hash combd's own sources
        id: src
        # Docs don't count: a change to them alone restarts nothing.
        run: echo "hash=$(git ls-tree -r HEAD combd guest | grep -v '\.md$' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/arena/Dockerfile
          push: true
          # Fresh base images (Debian's security fixes), not the runner's cache.
          pull: true
          build-args: |
            ARENA_VERSION=${{ github.sha }}
            COMBD_SOURCE=${{ steps.src.outputs.hash }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/combd-arena:latest
            ghcr.io/${{ github.repository_owner }}/combd-arena:${{ github.sha }}
      # The same files for nodes that run combd without Docker: a tarball on
      # the `arena` release, and a note of what's in it, uploaded last. The
      # note is signed (ed25519, ARENA_RELEASE_KEY; nodes hold the public half,
      # cloud/release.pub): a node checks the signature, then the tarball's
      # sha256 against the note, so writing to the release isn't enough.
      - name: Release the files (nodes fetch them, no Docker)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_KEY: ${{ secrets.ARENA_RELEASE_KEY }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/combd-arena:${{ github.sha }}
          SRC: ${{ steps.src.outputs.hash }}
        run: |
          rm -rf out && mkdir out
          id=$(docker create "$IMAGE") && docker cp "$id:/combd/." out/ && docker rm "$id" >/dev/null
          tar czf combd-arena-linux-amd64.tar.gz -C out .
          printf 'source=%s\nsha256=%s\ncommit=%s\n' "$SRC" "$(sha256sum combd-arena-linux-amd64.tar.gz | cut -d' ' -f1)" "$GITHUB_SHA" > combd-arena.txt
          key=$(mktemp) && printf '%s\n' "$RELEASE_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in combd-arena.txt -out combd-arena.txt.sig; signed=$?; rm -f "$key"; [ $signed = 0 ]
          gh release view arena >/dev/null 2>&1 || gh release create arena --prerelease --title "arena: the newest combd for the arena's nodes" --notes "Replaced on every push to main. combd-arena.txt says what's in the tarball."
          gh release upload arena combd-arena-linux-amd64.tar.gz --clobber
          gh release upload arena combd-arena.txt.sig combd-arena.txt --clobber
      # The build stage: the toolchain and sources that made this combd, so
      # a builder from it makes builds the nodes of this version load.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/arena/Dockerfile
          target: build
          push: true
          pull: true
          build-args: |
            ARENA_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/combd-builder:latest
            ghcr.io/${{ github.repository_owner }}/combd-builder:${{ github.sha }}
  deploy:
    needs: image
    runs-on: [self-hosted, linux, x64, combd-build]
    concurrency: arena-deploy
    steps:
      - name: Say a new version is coming (no new matches start)
        env:
          KEY: ${{ secrets.ARENA_DRAIN_KEY }}
        run: |
          body=$(python3 -c 'import json, os; print(json.dumps({"key": os.environ.get("KEY", "")}))')
          curl -s -m 15 -X POST https://arena.combd.dev/api/drain -d "$body" || true
          echo
      - name: Wait for live matches to end (up to 10 minutes)
        run: |
          for i in $(seq 1 60); do
            live=$(curl -s -m 10 https://arena.combd.dev/api/stats | python3 -c "
          import sys, json, time
          s = json.load(sys.stdin)
          r = s.get('recent', [])
          print(s['live'] if 'live' in s else sum(1 for m in r if not m.get('over') and m['at'] > time.time() * 1000 - 600000))" || echo 0)
            [ "$live" = "0" ] && exit 0
            echo "$live live match(es): waiting"
            sleep 10
          done
          echo "still live after 10 minutes: deploying anyway"
      - name: Deploy the game (through any node that answers)
        env:
          COMBD_TOKEN: ${{ secrets.ARENA_DEPLOY_TOKEN }}
          CA: ${{ secrets.ARENA_ADMIN_CA }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/combd-arena:${{ github.sha }}
        run: |
          printf '%s\n' "$CA" > ca.pem
          for try in 1 2 3 4 5 6; do
            for n in 0 1 2; do
              if docker run --rm -v "$PWD/ca.pem:/ca.pem:ro" -e COMBD_TOKEN -e COMBD_ADMIN_CA=/ca.pem -e COMBD_ADMIN_NAME=node$n.combd \
                "$IMAGE" ./target/release/combd deploy ../examples/arena/app acme "https://n$n.arena.combd.dev:9443"; then
                exit 0
              fi
            done
            sleep 20
          done
          exit 1
      - name: New matches again, once the new version is live (also if the deploy failed)
        if: always()
        env:
          KEY: ${{ secrets.ARENA_DRAIN_KEY }}
          SHA: ${{ github.sha }}
        run: |
          # The nodes load a deploy a few seconds after it's acknowledged: end
          # the drain on the new version (the old one may read it as "on").
          body=$(python3 -c 'import json, os; print(json.dumps({"key": os.environ.get("KEY", ""), "on": False}))')
          for i in $(seq 1 30); do
            v=$(curl -s -m 10 https://arena.combd.dev/api/stats | python3 -c 'import sys, json; print(json.load(sys.stdin).get("version", ""))' || true)
            if [ "$v" = "$SHA" ] || [ $i -eq 30 ]; then
              r=$(curl -s -m 15 -X POST https://arena.combd.dev/api/drain -d "$body" || true)
              echo "version $v: $r"
              case "$r" in *'"draining":false'*) exit 0;; esac
            fi
            sleep 5
          done
          echo "couldn't end the drain"; exit 1
