# The arena's image (combd and the game module), for the cloud demo: built
# on linux/amd64 and pushed to ghcr.io/<owner>/combd-arena. Make the package
# public once (GitHub, Packages, combd-arena, settings) so droplets can pull it.
name: arena image
on:
  push:
    branches: [main]
    paths: [spike/**, guest/**, guest-ev/**, examples/arena/**, "!examples/arena/cloud/**", "!examples/arena/**/*.md", .github/workflows/arena-image.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/arena/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/combd-arena:latest
            ghcr.io/${{ github.repository_owner }}/combd-arena:${{ github.sha }}
