[package]
name = "combd"
version = "0.0.0"
edition = "2021"
publish = false
# Cargo picks the newest deps that build on this Rust.
rust-version = "1.99"

[workspace]
resolver = "3"

[features]
default = ["wasmtime", "fuzz"]
# The AOT tier. Needs spike/aot/src/gen_*.rs, made by `aot.sh`.
aot = ["aot-lite"]
aot-lite = ["dep:combd-aot", "dep:combd-load"]
# The AOT tier with guard pages instead of bounds checks.
aot-guard = ["aot", "combd-aot/guard", "dep:corosensei"]
# EXPERIMENT ONLY: see combd-aot's `experiment-unchecked`.
aot-unchecked-experiment = ["aot-lite", "combd-aot/experiment-unchecked"]
# Differential fuzzing: random valid modules on every engine (`combd fuzz`).
fuzz = ["wasmtime", "dep:wasm-smith", "dep:arbitrary", "dep:wat"]

[dependencies]
combd-guest = { path = "../guest" }
# The data folder's free space (statvfs), without unsafe here.
rustix = { version = "1", features = ["fs"] }
combd-aot = { path = "aot", optional = true, default-features = false }
# Loading compiled modules' builds into a running node (the AOT tier's unsafe).
combd-load = { path = "load", optional = true }
# The listening socket with SO_REUSEPORT, so a new combd can take the port
# before the old one stops (already here, through tokio).
socket2 = { version = "0.6", features = ["all"] }
# Cells' memory, copy-on-write from their module's image: the interpreter's
# only unsafe code.
combd-mem = { path = "mem" }
corosensei = { version = "0.3.4", optional = true }
wasmparser = "0.261"
# The HTTP front: epoll/kqueue event loop and hyper's request parser.
mio = { version = "1", features = ["net", "os-poll"] }
httparse = "1"
# Durable Object storage: one SQLite file per object, in the host.
rusqlite = { version = "0.37", features = ["bundled", "hooks", "limits"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The wire between nodes: mTLS, and certificates for a fleet.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The bucket client: SigV4 signing, and Mozilla's root certificates for
# HTTPS buckets (S3, R2).
sha2 = "0.10"
webpki-roots = "1"
hmac = "0.12"
# Secrets: AES-256-GCM (rustls already brings it).
ring = "0.17"
wasmtime = { version = ">=40, <51", optional = true, default-features = false, features = ["cranelift", "runtime", "async", "std", "pooling-allocator"] }
# Random valid Wasm modules for differential fuzzing, the same wasm-tools
# release as wasmparser.
wasm-smith = { version = "0.261", optional = true }
arbitrary = { version = "1", optional = true }
# Hand-written AOT cases (`aot-cases/*.wat`) for the fuzz batch.
wat = { version = "1", optional = true }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
# A member's connection, async inside its own thread: a deferred reset goes
# out with the next statement, one round trip (the versions postgres uses).
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
# `sslmode=require`: the pool's connections over TLS (rustls, as the rest).
tokio-postgres-rustls = { version = "0.14", default-features = false, features = ["ring"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# An app's manifest: combd.toml, combd.yaml, or combd.json.
toml = "1"
serde_yaml_ng = "0.10"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# Generated AOT code is large; build it in parallel.
[profile.release.package.combd-aot]
codegen-units = 16

[dev-dependencies]
# Regression tests written in the Wasm text format.
wat = "1"
# The official spec testsuite's scripts (`.wast`), same version `wat` uses.
wast = "262"
