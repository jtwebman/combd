[package]
name = "combd-aot"
version = "0.0.0"
edition = "2021"
publish = false
description = "combd's AOT tier: Wasm modules compiled to plain safe Rust by `combd-spike aot-gen`."

[lib]
path = "src/lib.rs"

[dependencies]
libc = { version = "0.2", optional = true }
corosensei = { version = "0.3.4", optional = true }

[build-dependencies]
cc = "1"

[features]
default = ["js"]
# The QuickJS cell. Off for quick experiments, since it takes minutes to build.
js = []
# EXPERIMENT ONLY, NEVER SHIP: skips bounds checks with `unsafe`, to measure
# what they cost. Generated code needs COMBD_AOT_EXPERIMENT=unchecked.
experiment-unchecked = []
# Guard pages instead of bounds checks: `guard.rs` and `trap.c` hold the only
# unsafe code. Generated code stays `forbid(unsafe_code)`.
guard = ["dep:libc", "dep:corosensei"]
