[package]
name = "arena-game"
version = "0.0.0"
edition = "2021"
publish = false

# Its own workspace: its release profile (panic = abort) is the guest's own.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
