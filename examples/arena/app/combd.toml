# Arena: a real-time 1 vs 1 game on combd. One module, four processes.
[app]
name = "arena"
# Other apps share its nodes, so it names its own: the one name, and each
# node's (a match plays on the node best for both players). One per node in
# cloud/terraform.tfvars. Locally: localhost.
domains = ["arena.combd.dev", "n0.arena.combd.dev", "n1.arena.combd.dev", "n2.arena.combd.dev", "localhost"]

[vars]
# How long a pause (or a dropped player) may last before the other wins.
PAUSE_MS = 30000
# How long a match lasts: then more kills wins, and a tie is a draw.
MATCH_MS = 180000
# The worst round trip (ms) a match may start with, for the worse off of the
# two players on the node best for both. Farther apart: no match, however
# long they wait (a bot is still there).
MAX_RTT_MS = 150
# How far behind live spectators watch. They see everything, walls or not,
# so live would let a player watch their own match to see through walls.
SPECTATE_DELAY_MS = 10000

[secrets]
# Who may say "a new version is coming: start no new matches" (CI, before a
# deploy). Unset: nobody can.
"DRAIN_KEY?" = "drain-key"

# The page, and the join and poll API.
[processes.lobby]
kind = "game"
routes = ["/", "/api/*"]

# One matchmaker for everyone: pairs players who are close to each other.
[processes.matchmaker]
kind = "game"
durable = true
# Itself too: it notes a new match after answering, as a message to itself.
callers = ["lobby", "match", "matchmaker"]

# One object per match: the game, 20 ticks a second, over WebSockets.
[processes.match]
kind = "game"
durable = true
routes = ["/match/:id/*"]
callers = ["matchmaker"]

# One object per player: wins and losses.
[processes.player]
kind = "game"
durable = true
callers = ["lobby", "match"]
