# One Million Checkboxes on combd. Two modules, four processes.
[app]
name = "million"
# Locally, browsers send million.localhost to 127.0.0.1.
domains = ["million.combd.dev", "million.localhost"]

# The page, and the count of checked boxes.
[http.web]
module = "million"
routes = ["/", "/api/count"]

# One per WebSocket: what its page looks at, and the page's sets. Asleep
# after 2 s idle, it's just its socket and ~30 bytes of state (it keeps its
# own: "app"); the chunks' changes go straight to its socket and never wake it.
[ws.viewer]
module = "viewer"
routes = ["/ws"]
hibernate_ms = 2000
hibernate = "app"
# A closed socket's viewer just ends, unwoken: its chunks forget it when its
# subscriptions expire (60 s). Everyone leaving at once is then cheap.
on_close = "drop"
state_kb = 1
memory_kb = 512
callers = ["chunk"]

# One per 15,625 boxes (0 to 63): the bits, and who's watching.
[durable.chunk]
module = "million"
callers = ["viewer"]

# One: each chunk's count, for the total.
[durable.boxes]
module = "million"
callers = ["chunk", "web"]
