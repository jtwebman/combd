<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Million Checkboxes</title>
<style>
  :root { --bg: #fff; --fg: #111; --dim: #666; --line: #ddd; --accent: #2a6df4; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111; --fg: #eee; --dim: #999; --line: #333; --accent: #6d9cff; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 6px 8px; background: var(--bg); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; }
  .dim { color: var(--dim); }
  a { color: var(--accent); }
  label { margin-left: auto; }
  input[type=number] { width: 7em; font: inherit; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; }
  #space { position: relative; margin: 0 4px; }
  #status { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 4px 10px; border-radius: 4px; }
  #status:empty, #lag:empty { display: none; }
  #lag { position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 32px); background: #b3261e; color: #fff; padding: 4px 10px; border-radius: 4px; text-align: center; }
  #space input { position: absolute; margin: 0; width: 20px; height: 20px; accent-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>One Million Checkboxes</h1>
  <span class="dim">on <a href="https://github.com/jtwebman/combd">combd</a>. Checking a box checks it for everyone.</span>
  <span id="count"></span>
  <span id="at" class="dim"></span>
  <label>Go to box <input id="jump" type="number" min="1" max="1000000" inputmode="numeric"></label>
</header>
<div id="space"></div>
<div id="status" role="status"></div>
<div id="lag" role="alert"></div>
<script>
const TOTAL = 1_000_000, CHUNK = 15_625, SIZE = 26;
const space = document.getElementById("space");
const status = document.getElementById("status"), at = document.getElementById("at");
// The chunks being watched: chunk number -> its bits, once they're here.
const bits = new Map();
const pool = [];
let cols = 1, ws = null, watching = "", sentAt = 0, range = [0, 0];
// This page's clicks the server hasn't sent back yet: box -> when.
const unseen = new Map();
let retry = 1000;

const on = (i) => { const b = bits.get(Math.floor(i / CHUNK)), j = i % CHUNK; return b ? (b[j >> 3] >> (j & 7)) & 1 : null; };
const put = (n, j, v) => { const b = bits.get(n); if (b) b[j >> 3] = v ? b[j >> 3] | (1 << (j & 7)) : b[j >> 3] & ~(1 << (j & 7)); };

// One socket for the page. It says what's on screen; the server sends the
// boxes there, then every change to them.
function connect() {
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { watching = ""; retry = 1000; tell(); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.t === "all") bits.set(m.n, new Uint8Array(m.bits.match(/../g).map((h) => parseInt(h, 16))));
    else if (m.t === "set") { put(m.n, m.i, m.v); unseen.delete(m.n * CHUNK + m.i); }
    else if (m.t === "slow") { put(Math.floor(m.i / CHUNK), m.i % CHUNK, !on(m.i)); say("Slow down a little."); }
    draw();
  };
  // Back off, so a struggling server isn't also answering every page each second.
  ws.onclose = () => { bits.clear(); unseen.clear(); draw(); setTimeout(connect, retry * (0.5 + Math.random())); retry = Math.min(retry * 2, 30_000); };
}

// The range, when the chunks on screen change, and every 20 s to keep
// watching them.
function tell() {
  const [lo, hi] = range;
  const chunks = `${Math.floor(lo / CHUNK)}-${Math.floor((hi - 1) / CHUNK)}`;
  if (ws?.readyState !== WebSocket.OPEN || (chunks === watching && Date.now() - sentAt < 20_000)) return;
  if (chunks !== watching) for (const n of bits.keys()) if (n < Math.floor(lo / CHUNK) || n > Math.floor((hi - 1) / CHUNK)) bits.delete(n);
  ws.send(JSON.stringify({ t: "range", from: lo, to: hi }));
  watching = chunks;
  sentAt = Date.now();
}
setInterval(tell, 5000);

// Say so when the server stops keeping up: clicks not back, or the boxes on
// screen not here, after 5 s.
function health() {
  const late = Date.now() - 5000;
  const [lo, hi] = range;
  let msg = "";
  if (ws?.readyState !== WebSocket.OPEN) msg = "Lost the server. Reconnecting…";
  else if ([...unseen.values()].some((t) => t < late)) msg = "The server is behind: your clicks may not have reached everyone yet.";
  else if (sentAt < late && (on(lo) === null || on(Math.max(lo, hi - 1)) === null)) msg = "The server is slow to send these boxes.";
  document.getElementById("lag").textContent = msg;
}
setInterval(health, 1000);

let sayTimer;
function say(s) { status.textContent = s; clearTimeout(sayTimer); sayTimer = setTimeout(() => (status.textContent = ""), 2000); }

// The page is the boxes, edge to edge, and only the rows on screen exist.
// The columns are however many fit, spread to fill the width, so the same
// box sits somewhere else on every screen: a picture drawn on one is noise
// on the next.
function draw() {
  const width = space.clientWidth;
  cols = Math.max(1, Math.floor(width / SIZE));
  const step = width / cols;
  space.style.height = Math.ceil(TOTAL / cols) * SIZE + "px";
  // The bar stays on top, so what shows of the boxes starts at scrollY
  // (in their own coordinates) and is the window less the bar.
  const top = scrollY, bottom = scrollY + innerHeight - space.offsetTop;
  const shown = [Math.floor(top / SIZE) * cols + 1, Math.min(TOTAL, Math.ceil(bottom / SIZE) * cols)];
  at.textContent = `Boxes ${shown.map((n) => n.toLocaleString()).join(" – ")}`;
  const first = Math.max(0, Math.floor(top / SIZE) - 2);
  const last = Math.min(Math.ceil(TOTAL / cols), Math.ceil(bottom / SIZE) + 2);
  const lo = first * cols, hi = Math.min(TOTAL, last * cols);
  range = [lo, hi];
  tell();
  for (let k = 0; k < hi - lo; k++) {
    const i = lo + k;
    let b = pool[k];
    if (!b) { b = pool[k] = document.createElement("input"); b.type = "checkbox"; space.append(b); }
    const v = on(i);
    b.hidden = false;
    b.dataset.i = i;
    b.title = b.ariaLabel = `Box ${i + 1}`;
    b.checked = v === 1;
    b.disabled = v === null;
    b.style.transform = `translate(${(i % cols) * step + (step - 20) / 2}px, ${Math.floor(i / cols) * SIZE + 3}px)`;
  }
  for (let k = hi - lo; k < pool.length; k++) pool[k].hidden = true;
}

space.addEventListener("change", (e) => {
  const i = +e.target.dataset.i;
  if (ws?.readyState !== WebSocket.OPEN || on(i) === null) { draw(); return; }
  put(Math.floor(i / CHUNK), i % CHUNK, e.target.checked);
  unseen.set(i, Date.now());
  ws.send(JSON.stringify({ t: "set", i, v: e.target.checked }));
});

document.getElementById("jump").addEventListener("change", (e) => {
  const i = Math.min(TOTAL, Math.max(1, +e.target.value || 1)) - 1;
  // The bar stays on top, as tall as the space above the boxes: this puts
  // the row just under it.
  scrollTo(0, Math.floor(i / cols) * SIZE);
});

// How many are checked, across the million.
async function count() {
  try {
    const r = await (await fetch("/api/count")).json();
    if (typeof r.checked === "number") document.getElementById("count").textContent = `${r.checked.toLocaleString()} checked`;
  } catch {}
}
setInterval(count, 5000);

let queued = false;
const later = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; draw(); }); } };
addEventListener("scroll", later, { passive: true });
addEventListener("resize", later);
draw();
connect();
count();
</script>
</body>
</html>
